# Point-in-time universe: same as baseline_lgb.yaml but each stock only while it was an index member.
# Stage-1 baseline: S&P 500 daily bars -> Alpha158 -> LightGBM -> RankIC + cost-aware backtest.
run:
  name: baseline_lgb_pit        # report file prefix
  universe_note: 逐日历史成分股（Wikipedia 变更表重建，Qlib 分段有效期），每只股票只在其成员期内参与训练、预测与选股；被收购退市者因 Yahoo 无数据缺失，见 docs/04

data:
  start: "2010-01-01"
  end: null              # null = today
  raw_dir: data/raw
  norm_dir: data/normalized
  qlib_dir: data/qlib/us_sp500
  universe_cache: data/universe_sp500.json
  changes_cache: data/changes_sp500.json   # Wikipedia 'Historical components of the S&P 500'
  universe_name: sp500_pit   # point-in-time spells; written by scripts/01_build_data.py
  benchmark: SPY
  min_rows: 250          # drop symbols with < 1 trading year of data
  chunk_size: 20
  dump_workers: 8

dataset:
  handler: Alpha158
  # label: 5-day forward return, entered at next close (t+1) and exited at t+6 -> no look-ahead
  label: "Ref($close, -6) / Ref($close, -1) - 1"
  horizon_days: 5
  segments:
    train: ["2010-01-01", "2019-12-31"]
    valid: ["2020-01-01", "2021-12-31"]
    test:  ["2022-01-01", null]          # null = data end
  infer_processors:
    - {class: RobustZScoreNorm, kwargs: {fields_group: feature, clip_outlier: true}}
    - {class: Fillna, kwargs: {fields_group: feature}}
  learn_processors:
    - {class: DropnaLabel}
    - {class: CSRankNorm, kwargs: {fields_group: label}}

model:
  # Qlib's published Alpha158/LightGBM benchmark settings, threads adapted to this machine
  class: LGBModel
  kwargs:
    loss: mse
    colsample_bytree: 0.8879
    learning_rate: 0.2
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 16
  num_boost_round: 1000
  early_stopping_rounds: 50

backtest:
  topk: 50
  n_drop: 5
  account: 100000
  # costs: IBKR commissions are small; 5 bps per side approximates commission + slippage for large caps
  open_cost: 0.0005
  close_cost: 0.0005
  min_cost: 1
  deal_price: close
  limit_threshold: null

qlib:
  region: us
  kernels: 8
